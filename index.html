<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Console Chat</title>
<style>
body{margin:0;background:#0e0e0e;color:#00ff99;font-family:monospace}
#status{padding:6px 10px;font-size:12px;background:#300;color:#ff6b6b}
#log{height:78vh;overflow:auto;padding:10px;border-bottom:1px solid #222}
.msg{margin-bottom:10px}
.quote{font-size:12px;background:#1a1a1a;border-left:3px solid #00ff99;padding:4px}
.reacts span{cursor:pointer;margin-right:6px}
img{max-width:200px;border-radius:6px;margin-top:4px}
.small{font-size:11px;color:#888;cursor:pointer}
input,button{background:#000;color:#00ff99;border:none;padding:10px}
</style>
</head>

<body>
<div id="status">● Offline</div>
<div id="log"></div>
<div id="reply"></div>
<div id="typing"></div>

<div>
<button id="emoji">😊</button>
<button id="fileBtn">📎</button>
<input type="file" id="file" hidden>
<input id="text" placeholder="type & enter">
</div>

<div id="emojiPanel" style="display:none">😀 😂 😊 😍 😘 😎 😢 😡 👍 ❤️ 🔥</div>

<script>
const ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host);
const log=document.getElementById("log"),text=document.getElementById("text");
const status=document.getElementById("status"),typing=document.getElementById("typing");
const emojiPanel=document.getElementById("emojiPanel");
const myId=Math.random().toString(36).slice(2,8),me="User-"+myId;
let replyTo=null;

ws.onopen=()=>{status.textContent="● Online";status.style.background="#002b1a";}
ws.onclose=()=>{status.textContent="● Offline";status.style.background="#300";}

ws.onmessage=e=>{
 const m=JSON.parse(e.data);
 if(m.type==="history") log.innerHTML="",m.data.forEach(draw);
 if(m.type==="message") draw(m);
 if(m.type==="reaction") updateReacts(m);
 if(m.type==="presence" && m.user!==me){
  typing.textContent=m.state==="online"?`${m.user} online`:`${m.user} last seen`;
 }
};

function draw(m){
 const d=document.createElement("div");d.id="w-"+m.id;d.className="msg";
 if(m.replyTo)d.innerHTML+=`<div class=quote>${m.replyTo.user}: ${m.replyTo.text}</div>`;
 if(m.file && m.file.startsWith("data:image"))
   d.innerHTML+=`<img src="${m.file}">`;
 else if(m.file)
   d.innerHTML+=`<a href="${m.file}" target=_blank>${m.filename}</a>`;
 else d.innerHTML+=`${m.user}: ${m.text}`;

 d.innerHTML+=`<div class="reacts" id="r-${m.id}">
   <span onclick="react('${m.id}','👍')">👍</span>
   <span onclick="react('${m.id}','❤️')">❤️</span>
   <span onclick="react('${m.id}','😘')">😘</span>
 </div>`;

 if(m.user===me)
   d.innerHTML+=`<span class=small onclick="del('${m.id}')"> 🗑️</span>`;

 log.appendChild(d); log.scrollTop=log.scrollHeight;
}

function react(id,emoji){
 ws.send(JSON.stringify({type:"reaction",id,emoji,user:me}));
}

function updateReacts(m){
 const r=document.getElementById("r-"+m.id);
 if(!r||!m.reactions)return;
 r.innerHTML="";
 Object.entries(m.reactions).forEach(([e,u])=>{
  if(u.length) r.innerHTML+=`${e} ${u.length} `;
 });
}

function del(id){ws.send(JSON.stringify({type:"delete",id}))}

text.onkeydown=e=>{
 if(e.key==="Enter"&&text.value){
  ws.send(JSON.stringify({
   type:"message",id:Date.now()+"-"+myId,user:me,text:text.value,replyTo
  }));
  text.value="";replyTo=null;
 }
};

emoji.onclick=()=>emojiPanel.style.display=
 emojiPanel.style.display==="none"?"block":"none";

emojiPanel.onclick=e=>{
 if(e.target.textContent){text.value+=e.target.textContent;}
};

fileBtn.onclick=()=>file.click();
file.onchange=()=>{
 const r=new FileReader();
 r.onload=()=>ws.send(JSON.stringify({
  type:"message",id:Date.now()+"-"+myId,user:me,
  file:r.result,filename:file.files[0].name
 }));
 r.readAsDataURL(file.files[0]);
};

document.addEventListener("visibilitychange",()=>{
 ws.send(JSON.stringify({
  type:"presence",user:me,state:document.hidden?"offline":"online"
 }));
});
</script>
</body>
</html>
