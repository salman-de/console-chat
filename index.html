<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Console Chat</title>

  <style>
    body {
      margin: 0;
      background: #0e0e0e;
      color: #00ff99;
      font-family: monospace;
    }

    #log {
      height: 82vh;
      overflow-y: auto;
      padding: 10px;
      border-bottom: 1px solid #222;
    }

    #replyBox {
      padding: 6px 10px;
      font-size: 12px;
      color: #ccc;
      background: #111;
      display: none;
    }

    #typing {
      padding: 4px 10px;
      font-size: 12px;
      color: #888;
    }

    /* 🔹 input row */
    #inputRow {
      display: flex;
      align-items: center;
      border-top: 1px solid #222;
    }

    #emojiBtn {
      background: #000;
      color: #00ff99;
      border: none;
      font-size: 20px;
      padding: 0 12px;
      cursor: pointer;
    }

    #input {
      flex: 1;
      padding: 14px;
      background: #000;
      color: #00ff99;
      border: none;
      outline: none;
      font-family: monospace;
    }

    .msg {
      position: relative;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .quote {
      color: #888;
      font-size: 12px;
      border-left: 2px solid #444;
      padding-left: 6px;
      margin-bottom: 2px;
    }

    .reply-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      opacity: 0;
      font-size: 16px;
      color: #00ff99;
      pointer-events: none;
      transition: opacity 0.15s ease;
    }
  </style>
</head>

<body>
  <div id="log">> loading...</div>
  <div id="replyBox"></div>
  <div id="typing"></div>

  <!-- 🔹 INPUT + EMOJI -->
  <div id="inputRow">
    <button id="emojiBtn">😊</button>
    <input id="input" placeholder="type and press enter" />
  </div>

  <script>
    let ws;
    let connected = false;
    let replyTo = null;

    const myId = Math.random().toString(36).slice(2, 8);
    const myName = "User-" + myId;

    const log = document.getElementById("log");
    const input = document.getElementById("input");
    const typingDiv = document.getElementById("typing");
    const replyBox = document.getElementById("replyBox");
    const emojiBtn = document.getElementById("emojiBtn");

    if (Notification.permission !== "granted") {
      Notification.requestPermission();
    }

    function notify(text) {
      if (document.hidden && Notification.permission === "granted") {
        new Notification("Console Chat", { body: text });
      }
    }

    function connect() {
      if (connected) return;
      connected = true;

      const protocol = location.protocol === "https:" ? "wss://" : "ws://";
      ws = new WebSocket(protocol + location.host);

      ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);

        if (msg.type === "history") {
          log.innerHTML = "";
          msg.data.forEach(renderMessage);
          return;
        }

        if (msg.type === "typing") {
          typingDiv.textContent = `${msg.user} is typing...`;
          setTimeout(() => typingDiv.textContent = "", 1000);
          return;
        }

        if (msg.type === "message") {
          renderMessage(msg);
          notify(`${msg.user}: ${msg.text}`);
        }
      };

      ws.onclose = () => {
        connected = false;
      };
    }

    function activateReply(msg) {
      replyTo = { user: msg.user, text: msg.text };
      replyBox.style.display = "block";
      replyBox.textContent = `Replying to ${msg.user}: "${msg.text}"`;
      input.focus();
    }

    function renderMessage(msg) {
      const div = document.createElement("div");
      div.className = "msg";

      const icon = document.createElement("div");
      icon.className = "reply-icon";
      icon.textContent = "↩️";
      div.appendChild(icon);

      let html = "";

      if (msg.replyTo) {
        html += `<div class="quote">↪ ${msg.replyTo.user}: ${msg.replyTo.text}</div>`;
      }

      html += msg.user === myName
        ? `<span style="color:#4fc3f7">> you: ${msg.text}</span>`
        : `<span>> ${msg.user}: ${msg.text}</span>`;

      const content = document.createElement("div");
      content.innerHTML = html;
      div.appendChild(content);

      div.onclick = () => activateReply(msg);

      let startX = 0;
      let currentX = 0;

      div.addEventListener("touchstart", e => {
        startX = e.touches[0].clientX;
        div.style.transition = "none";
      });

      div.addEventListener("touchmove", e => {
        currentX = e.touches[0].clientX - startX;
        if (currentX > 0) {
          div.style.transform = `translateX(${currentX}px)`;
          if (currentX > 20) {
            icon.style.opacity = Math.min(currentX / 80, 1);
          }
        }
      });

      div.addEventListener("touchend", () => {
        div.style.transition = "transform 0.2s ease";
        div.style.transform = "translateX(0)";
        icon.style.opacity = 0;

        if (currentX > 80) {
          activateReply(msg);
        }
        currentX = 0;
      });

      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    connect();

    // 🔹 emoji button → native emoji keyboard
    emojiBtn.onclick = () => {
      input.focus();
    };

    input.addEventListener("input", () => {
      ws.send(JSON.stringify({ type: "typing", user: myName }));
    });

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && input.value.trim()) {
        ws.send(JSON.stringify({
          type: "message",
          user: myName,
          text: input.value,
          time: Date.now(),
          replyTo: replyTo
        }));

        replyTo = null;
        replyBox.style.display = "none";
        input.value = "";
      }
    });
  </script>
</body>
</html>
