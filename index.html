<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Console Chat</title>

  <style>
    body {
      margin: 0;
      background: #0e0e0e;
      color: #00ff99;
      font-family: monospace;
    }
    #log {
      height: 85vh;
      overflow-y: auto;
      padding: 10px;
      border-bottom: 1px solid #222;
    }
    #input {
      width: 100%;
      padding: 14px;
      background: #000;
      color: #00ff99;
      border: none;
      outline: none;
      font-family: monospace;
    }
    #typing {
      padding: 4px 10px;
      font-size: 12px;
      color: #888;
    }
  </style>
</head>

<body>
  <div id="log">> loading...</div>
  <div id="typing"></div>
  <input id="input" placeholder="type and press enter" />

  <script>
    let ws;
    let connected = false;

    const myId = Math.random().toString(36).slice(2, 8);
    const myName = "User-" + myId;

    const log = document.getElementById("log");
    const input = document.getElementById("input");
    const typingDiv = document.getElementById("typing");

    // 🔔 notification permission
    if (Notification.permission !== "granted") {
      Notification.requestPermission();
    }

    function notify(text) {
      if (document.hidden && Notification.permission === "granted") {
        new Notification("Console Chat", { body: text });
      }
    }

    function connect() {
      if (connected) return;
      connected = true;

      const protocol = location.protocol === "https:" ? "wss://" : "ws://";
      ws = new WebSocket(protocol + location.host);

      ws.onopen = () => {
        log.innerHTML += "<br>> connected";
      };

      ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);

        // 📜 history load
        if (msg.type === "history") {
          log.innerHTML = "";
          msg.data.forEach(m => renderMessage(m));
          return;
        }

        // ✍️ typing
        if (msg.type === "typing") {
          typingDiv.textContent = `${msg.user} is typing...`;
          setTimeout(() => typingDiv.textContent = "", 1000);
          return;
        }

        // 👁️ seen
        if (msg.type === "seen") {
          log.innerHTML += `<br><span style="color:#888">> seen by ${msg.user}</span>`;
          return;
        }

        // 💬 message
        if (msg.type === "message") {
          renderMessage(msg);
          notify(`${msg.user}: ${msg.text}`);

          ws.send(JSON.stringify({
            type: "seen",
            user: myName
          }));
        }
      };

      ws.onclose = () => {
        log.innerHTML += "<br>> disconnected";
        connected = false;
      };
    }

    function renderMessage(msg) {
      const line =
        msg.user === myName
          ? `<span style="color:#4fc3f7">> you: ${msg.text}</span>`
          : `<span>> ${msg.user}: ${msg.text}</span>`;

      log.innerHTML += "<br>" + line;
      log.scrollTop = log.scrollHeight;
    }

    connect();

    // ✍️ typing send
    input.addEventListener("input", () => {
      ws.send(JSON.stringify({
        type: "typing",
        user: myName
      }));
    });

    // 📤 send message
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && input.value.trim()) {
        ws.send(JSON.stringify({
          type: "message",
          user: myName,
          text: input.value,
          time: Date.now()
        }));
        input.value = "";
      }
    });
  </script>
</body>
</html>
