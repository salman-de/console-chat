<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Console Chat</title>

<!-- Emoji Mart -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/emoji-mart@latest/css/emoji-mart.css">
<script src="https://cdn.jsdelivr.net/npm/emoji-mart@latest/dist/browser.js"></script>

<style>
body {
  margin: 0;
  background: #0e0e0e;
  color: #00ff99;
  font-family: monospace;
}
#log {
  height: 80vh;
  overflow-y: auto;
  padding: 10px;
  border-bottom: 1px solid #222;
}
#replyBox {
  padding: 6px 10px;
  font-size: 12px;
  color: #ccc;
  background: #111;
  display: none;
}
#typing {
  padding: 4px 10px;
  font-size: 12px;
  color: #888;
}
.input-wrap {
  display: flex;
  align-items: center;
  background: #000;
}
#emojiBtn {
  background: none;
  border: none;
  font-size: 22px;
  padding: 10px;
  cursor: pointer;
}
#input {
  flex: 1;
  padding: 14px;
  background: #000;
  color: #00ff99;
  border: none;
  outline: none;
  font-family: monospace;
}
.msg {
  position: relative;
  cursor: pointer;
}
.quote {
  color: #888;
  font-size: 12px;
  border-left: 2px solid #444;
  padding-left: 6px;
  margin-bottom: 2px;
}
.reply-icon {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  opacity: 0;
  font-size: 16px;
  color: #00ff99;
  pointer-events: none;
}
#emojiPicker {
  position: absolute;
  bottom: 60px;
  left: 10px;
  display: none;
  z-index: 999;
}
.status {
  font-size: 11px;
  margin-left: 6px;
  color: #888;
}
</style>
</head>

<body>

<div id="log">> loading...</div>
<div id="replyBox"></div>
<div id="typing"></div>

<div class="input-wrap">
  <button id="emojiBtn">😊</button>
  <input id="input" placeholder="type and press enter" />
</div>

<div id="emojiPicker"></div>

<script>
let ws;
let connected = false;
let replyTo = null;

const myId = Math.random().toString(36).slice(2, 8);
const myName = "User-" + myId;

const log = document.getElementById("log");
const input = document.getElementById("input");
const typingDiv = document.getElementById("typing");
const replyBox = document.getElementById("replyBox");

/* Notifications */
if (Notification.permission !== "granted") {
  Notification.requestPermission();
}
function notify(text) {
  if (document.hidden && Notification.permission === "granted") {
    new Notification("Console Chat", { body: text });
  }
}

/* WebSocket */
function connect() {
  if (connected) return;
  connected = true;

  const protocol = location.protocol === "https:" ? "wss://" : "ws://";
  ws = new WebSocket(protocol + location.host);

  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);

    if (msg.type === "history") {
      log.innerHTML = "";
      msg.data.forEach(renderMessage);
      return;
    }

    if (msg.type === "typing") {
      typingDiv.textContent = `${msg.user} is typing...`;
      setTimeout(() => typingDiv.textContent = "", 1000);
      return;
    }

    if (msg.type === "message") {
      renderMessage(msg);
      notify(`${msg.user}: ${msg.text}`);

      // delivered signal (receiver side)
      if (msg.user !== myName) {
        ws.send(JSON.stringify({
          type: "delivered",
          id: msg.id,
          from: myName
        }));
      }
      return;
    }

    if (msg.type === "delivered") {
      const el = document.getElementById("status-" + msg.id);
      if (el) el.textContent = "✓✓";
      return;
    }

    if (msg.type === "seen") {
      const el = document.getElementById("status-" + msg.id);
      if (el) {
        el.textContent = "✓✓";
        el.style.color = "#4fc3f7"; // blue
      }
      return;
    }
  };

  ws.onclose = () => connected = false;
}

function activateReply(msg) {
  replyTo = { user: msg.user, text: msg.text };
  replyBox.style.display = "block";
  replyBox.textContent = `Replying to ${msg.user}: "${msg.text}"`;
  input.focus();
}

function renderMessage(msg) {
  const div = document.createElement("div");
  div.className = "msg";

  const icon = document.createElement("div");
  icon.className = "reply-icon";
  icon.textContent = "↩️";
  div.appendChild(icon);

  let html = "";
  if (msg.replyTo) {
    html += `<div class="quote">↪ ${msg.replyTo.user}: ${msg.replyTo.text}</div>`;
  }

  const content = document.createElement("div");
  content.innerHTML =
    msg.user === myName
      ? `<span style="color:#4fc3f7">> you: ${msg.text}</span>`
      : `<span>> ${msg.user}: ${msg.text}</span>`;

  // status (only for my messages)
  if (msg.user === myName) {
    const status = document.createElement("span");
    status.className = "status";
    status.id = "status-" + msg.id;
    status.textContent = "✓"; // sent
    content.appendChild(status);
  }

  div.appendChild(content);
  div.onclick = () => activateReply(msg);

  // swipe reply (mobile)
  let startX = 0, currentX = 0;
  div.addEventListener("touchstart", e => {
    startX = e.touches[0].clientX;
    div.style.transition = "none";
  });
  div.addEventListener("touchmove", e => {
    currentX = e.touches[0].clientX - startX;
    if (currentX > 0) {
      div.style.transform = `translateX(${currentX}px)`;
      icon.style.opacity = Math.min(currentX / 80, 1);
    }
  });
  div.addEventListener("touchend", () => {
    div.style.transition = "transform 0.2s ease";
    div.style.transform = "translateX(0)";
    icon.style.opacity = 0;
    if (currentX > 80) activateReply(msg);
    currentX = 0;
  });

  log.appendChild(div);
  log.scrollTop = log.scrollHeight;

  // seen signal (receiver side)
  if (msg.user !== myName) {
    ws.send(JSON.stringify({
      type: "seen",
      id: msg.id,
      from: myName
    }));
  }
}

connect();

/* typing */
input.addEventListener("input", () => {
  ws.send(JSON.stringify({ type: "typing", user: myName }));
});

/* send message */
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && input.value.trim()) {
    ws.send(JSON.stringify({
      type: "message",
      id: Date.now() + "-" + myId,
      user: myName,
      text: input.value,
      time: Date.now(),
      replyTo: replyTo
    }));
    replyTo = null;
    replyBox.style.display = "none";
    input.value = "";
  }
});

/* Emoji Picker */
const emojiBtn = document.getElementById("emojiBtn");
const pickerDiv = document.getElementById("emojiPicker");

const picker = new EmojiMart.Picker({
  theme: "dark",
  onEmojiSelect: (emoji) => {
    input.value += emoji.native;
    input.focus();
  }
});

pickerDiv.appendChild(picker);

emojiBtn.onclick = () => {
  pickerDiv.style.display =
    pickerDiv.style.display === "none" ? "block" : "none";
};

document.addEventListener("click", e => {
  if (!emojiBtn.contains(e.target) && !pickerDiv.contains(e.target)) {
    pickerDiv.style.display = "none";
  }
});
</script>

</body>
</html>
