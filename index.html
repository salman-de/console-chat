<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Console Chat</title>

<style>
body{margin:0;background:#0e0e0e;color:#00ff99;font-family:monospace}
#status{padding:6px 10px;font-size:12px;background:#300;color:#ff6b6b}
#log{height:78vh;overflow:auto;padding:10px;border-bottom:1px solid #222}

.msg{margin-bottom:16px;position:relative}
.quote{font-size:12px;background:#1a1a1a;border-left:3px solid #00ff99;padding:4px;margin-bottom:4px}
.reacts{margin-top:4px;font-size:14px}
.reacts span{margin-right:8px}

img{max-width:200px;border-radius:6px;margin-top:4px}
.small{font-size:11px;color:#888;cursor:pointer}

input,button{background:#000;color:#00ff99;border:none;padding:10px}

/* PC hover reaction strip */
.hover-bar{
 position:absolute;
 top:-42px;
 left:0;
 background:#111;
 padding:6px 10px;
 border-radius:20px;
 display:none;
 gap:10px;
 animation:pop .15s ease-out;
 z-index:10;
}
.hover-bar span{
 font-size:20px;
 cursor:pointer;
}

/* mobile picker */
#picker{
 display:none;
 position:fixed;
 bottom:90px;
 left:50%;
 transform:translateX(-50%);
 background:#111;
 padding:10px;
 border-radius:14px;
 z-index:999;
}
#picker span{font-size:26px;margin:8px;cursor:pointer}

/* animation */
.react-float{
 position:absolute;
 bottom:20px;
 left:20px;
 font-size:22px;
 animation:floatUp .6s ease-out forwards;
}

@keyframes pop{
 from{transform:scale(.6);opacity:0}
 to{transform:scale(1);opacity:1}
}
@keyframes floatUp{
 from{opacity:1;transform:translateY(0)}
 to{opacity:0;transform:translateY(-25px)}
}
</style>
</head>

<body>

<div id="status">● Offline</div>
<div id="log"></div>

<div>
<button id="fileBtn">📎</button>
<input type="file" id="file" hidden>
<input id="text" placeholder="type & enter">
</div>

<!-- mobile picker -->
<div id="picker">👍 ❤️ 😘 🤣 😁 🥰 🫡</div>

<script>
const ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host);
const log=document.getElementById("log");
const text=document.getElementById("text");
const status=document.getElementById("status");
const picker=document.getElementById("picker");

const myId=Math.random().toString(36).slice(2,8);
const me="User-"+myId;

let reactTarget=null;
let longPressTimer=null;

ws.onopen=()=>{status.textContent="● Online";status.style.background="#002b1a";}
ws.onclose=()=>{status.textContent="● Offline";status.style.background="#300";}

ws.onmessage=e=>{
 const m=JSON.parse(e.data);
 if(m.type==="history"){log.innerHTML="";m.data.forEach(draw);}
 if(m.type==="message") draw(m);
 if(m.type==="reaction") updateReacts(m);
 if(m.type==="delete"){
  const el=document.getElementById("w-"+m.id);
  if(el) el.remove();
 }
};

function draw(m){
 const d=document.createElement("div");
 d.className="msg";
 d.id="w-"+m.id;

 if(m.replyTo){
  const q=document.createElement("div");
  q.className="quote";
  q.textContent=`↪ ${m.replyTo.user}: ${m.replyTo.text}`;
  d.appendChild(q);
 }

 const content=document.createElement("div");
 content.textContent=`${m.user}: ${m.text||""}`;
 d.appendChild(content);

 if(m.file && m.file.startsWith("data:image")){
  const img=document.createElement("img");
  img.src=m.file;
  d.appendChild(img);
 }

 /* reactions display */
 const r=document.createElement("div");
 r.className="reacts";
 r.id="r-"+m.id;
 d.appendChild(r);

 /* delete (own msg) */
 if(m.user===me){
  const del=document.createElement("span");
  del.textContent=" 🗑️";
  del.className="small";
  del.onclick=e=>{
   e.stopPropagation();
   ws.send(JSON.stringify({type:"delete",id:m.id}));
  };
  d.appendChild(del);
 }

 /* PC HOVER BAR */
 const hover=document.createElement("div");
 hover.className="hover-bar";
 hover.innerHTML="👍 ❤️ 😘 🤣 😁 🥰 🫡";
 d.appendChild(hover);

 d.addEventListener("mouseenter",()=>{
  if(window.innerWidth>768) hover.style.display="flex";
 });
 d.addEventListener("mouseleave",()=>{
  hover.style.display="none";
 });

 hover.onclick=e=>{
  const emoji=e.target.textContent;
  if(!emoji) return;
  sendReaction(m.id,emoji,d);
 };

 /* MOBILE LONG PRESS */
 d.addEventListener("touchstart",()=>{
  longPressTimer=setTimeout(()=>{
   reactTarget=m.id;
   picker.style.display="block";
  },500);
 });
 d.addEventListener("touchend",()=>clearTimeout(longPressTimer));

 log.appendChild(d);
 log.scrollTop=log.scrollHeight;
 updateReacts(m);
}

function sendReaction(id,emoji,box){
 ws.send(JSON.stringify({
  type:"reaction",
  id,
  emoji,
  user:me
 }));

 // animation
 const anim=document.createElement("div");
 anim.className="react-float";
 anim.textContent=emoji;
 box.appendChild(anim);
 setTimeout(()=>anim.remove(),600);
}

function updateReacts(m){
 const r=document.getElementById("r-"+m.id);
 if(!r || !m.reactions) return;

 let html="";
 Object.entries(m.reactions).forEach(([e,u])=>{
  if(u.length) html+=`${e} ${u.length} `;
 });

 r.innerHTML=html;
 r.style.display=html?"block":"none";
}

/* mobile picker click */
picker.onclick=e=>{
 const emoji=e.target.textContent;
 if(!emoji||!reactTarget) return;
 const box=document.getElementById("w-"+reactTarget);
 sendReaction(reactTarget,emoji,box);
 picker.style.display="none";
 reactTarget=null;
};

/* send msg */
text.onkeydown=e=>{
 if(e.key==="Enter" && text.value){
  ws.send(JSON.stringify({
   type:"message",
   id:Date.now()+"-"+myId,
   user:me,
   text:text.value
  }));
  text.value="";
 }
};

/* file */
fileBtn.onclick=()=>file.click();
file.onchange=()=>{
 const r=new FileReader();
 r.onload=()=>ws.send(JSON.stringify({
  type:"message",
  id:Date.now()+"-"+myId,
  user:me,
  file:r.result,
  filename:file.files[0].name
 }));
 r.readAsDataURL(file.files[0]);
};

/* hide mobile picker */
document.addEventListener("touchstart",e=>{
 if(!picker.contains(e.target)) picker.style.display="none";
});
</script>

</body>
</html>
