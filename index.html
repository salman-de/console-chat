<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Console Chat</title>

<style>
body{margin:0;background:#0e0e0e;color:#eaeaea;font-family:sans-serif}
#log{height:80vh;overflow:auto;padding:10px}
.msg{margin-bottom:14px;position:relative;padding:6px 8px;border-radius:6px}
.msg:hover{background:#151515}
.user{font-weight:600}
.text{margin-top:2px}
.quote{
  font-size:12px;
  background:#1a1a1a;
  border-left:3px solid #00ff99;
  padding:4px 6px;
  margin-bottom:4px;
  color:#ccc;
}
.reacts{margin-top:4px;font-size:13px;color:#aaa}
.reacts span{margin-right:6px}

/* hover reaction bar (PC) */
.hover-bar{
  display:none;
  position:absolute;
  top:-34px;
  left:6px;
  background:#111;
  padding:6px 10px;
  border-radius:18px;
  gap:8px;
}
.hover-bar span{cursor:pointer;font-size:18px}
.msg:hover .hover-bar{display:flex}

/* mobile picker */
#picker{
  display:none;
  position:fixed;
  bottom:90px;
  left:50%;
  transform:translateX(-50%);
  background:#111;
  padding:10px;
  border-radius:18px;
  z-index:999;
}
#picker span{font-size:24px;margin:8px;cursor:pointer}

/* input */
#inputWrap{display:flex;border-top:1px solid #222}
#text{flex:1;padding:12px;background:#000;color:#fff;border:none;outline:none}
</style>
</head>

<body>

<div id="log"></div>

<div id="inputWrap">
  <input id="text" placeholder="Type & enter">
</div>

<div id="picker">👍 ❤️ 😂 😍 😮 😢 😡</div>

<script>
const ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host);
const log=document.getElementById("log");
const text=document.getElementById("text");
const picker=document.getElementById("picker");

const myId=Math.random().toString(36).slice(2,8);
const me="User-"+myId;

let replyTo=null;
let reactTarget=null;
let pressTimer=null;

ws.onmessage=e=>{
 const data=JSON.parse(e.data);
 if(data.type==="history"){log.innerHTML="";data.data.forEach(render);}
 if(data.type==="message") render(data);
 if(data.type==="reaction") updateReacts(data.message);
};

function render(m){
 const d=document.createElement("div");
 d.className="msg";
 d.id="m-"+m.id;

 if(m.replyTo){
  const q=document.createElement("div");
  q.className="quote";
  q.textContent=`Reply to ${m.replyTo.user}: ${m.replyTo.text}`;
  d.appendChild(q);
 }

 const u=document.createElement("div");
 u.className="user";
 u.textContent=m.user;
 d.appendChild(u);

 const t=document.createElement("div");
 t.className="text";
 t.textContent=m.text;
 d.appendChild(t);

 // PC hover reactions
 const hover=document.createElement("div");
 hover.className="hover-bar";
 hover.innerHTML="👍 ❤️ 😂 😍 😮 😢 😡";
 hover.onclick=e=>{
  if(e.target.tagName==="SPAN"){
    sendReaction(m.id,e.target.textContent,d);
  }
 };
 d.appendChild(hover);

 // reaction strip
 const r=document.createElement("div");
 r.className="reacts";
 r.id="r-"+m.id;
 d.appendChild(r);

 // reply on click
 d.onclick=()=>{
   replyTo={id:m.id,user:m.user,text:m.text};
 };

 // mobile long press
 d.addEventListener("touchstart",()=>{
  pressTimer=setTimeout(()=>{
    reactTarget=m.id;
    picker.style.display="block";
  },500);
 });
 d.addEventListener("touchend",()=>clearTimeout(pressTimer));

 log.appendChild(d);
 log.scrollTop=log.scrollHeight;
 updateReacts(m);
}

function sendReaction(id,emoji,box){
 ws.send(JSON.stringify({type:"reaction",id,emoji,user:me}));
 const anim=document.createElement("div");
 anim.textContent=emoji;
 anim.style.position="absolute";
 anim.style.bottom="10px";
 anim.style.left="10px";
 anim.style.opacity="0.8";
 box.appendChild(anim);
 setTimeout(()=>anim.remove(),500);
}

function updateReacts(m){
 const r=document.getElementById("r-"+m.id);
 if(!r||!m.reactions) return;
 let html="";
 Object.entries(m.reactions).forEach(([e,u])=>{
   if(u.length) html+=`${e} ${u.length} `;
 });
 r.innerHTML=html;
}

picker.onclick=e=>{
 const emoji=e.target.textContent;
 if(!emoji||!reactTarget) return;
 const box=document.getElementById("m-"+reactTarget);
 sendReaction(reactTarget,emoji,box);
 picker.style.display="none";
 reactTarget=null;
};

text.onkeydown=e=>{
 if(e.key==="Enter" && text.value){
  ws.send(JSON.stringify({
    type:"message",
    id:Date.now()+"-"+myId,
    user:me,
    text:text.value,
    replyTo:replyTo
  }));
  replyTo=null;
  text.value="";
 }
};
</script>

</body>
</html>
